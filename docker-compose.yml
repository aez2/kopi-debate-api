version: "3.9"
services:
  api:
    build: .
    environment:
      - ENGINE_BACKEND=${ENGINE_BACKEND:-local}
      - OPENAI_API_KEY
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - REDIS_URL=redis://redis:6379/0
      - RESPONSE_TIMEOUT=25
    ports:
      - "8000:8000"
    depends_on:
      - redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
